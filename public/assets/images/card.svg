<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Credit card -->
  <rect x="2" y="6" width="20" height="12" rx="2" stroke="#FF4444" stroke-width="1.5" fill="none"/>
  <!-- Magnetic stripe -->
  <rect x="2" y="9" width="20" height="2" fill="#FF4444"/>
  <!-- Chip -->
  <rect x="4" y="13" width="3" height="2" rx="0.5" fill="#FF4444"/>
  <!-- Card numbers (dots) -->
  <circle cx="9" cy="14" r="0.5" fill="#FF4444"/>
  <circle cx="11" cy="14" r="0.5" fill="#FF4444"/>
  <circle cx="13" cy="14" r="0.5" fill="#FF4444"/>
  <circle cx="15" cy="14" r="0.5" fill="#FF4444"/>
</svg>